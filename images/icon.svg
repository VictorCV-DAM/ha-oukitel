<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#001f54" />
      <stop offset="100%" stop-color="#034078" />
    </linearGradient>

    <!-- Battery Border Neon Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00bbf9" />
      <stop offset="100%" stop-color="#4361ee" />
    </linearGradient>

    <!-- Energy Core Liquid Gradient -->
    <linearGradient id="energyLiquid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#00bbf9" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#70e000" stop-opacity="0.95" />
    </linearGradient>

    <!-- Energy Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.65; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes lightningPulse {
      0%, 100% { opacity: 0.95; filter: drop-shadow(0 0 10px #ffe600); }
      50% { opacity: 1; filter: drop-shadow(0 0 25px #00f5d4); }
    }
    @keyframes liquidFlow {
      0% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }
    @keyframes orbitParticles {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .bg-circle {
      animation: pulseGlow 4s ease-in-out infinite;
      transform-origin: center;
    }
    .energy-core {
      animation: liquidFlow 3s ease-in-out infinite;
    }
    .lightning-bolt {
      animation: lightningPulse 2s ease-in-out infinite;
      transform-origin: center;
    }
    .particle-ring {
      animation: orbitParticles 12s linear infinite;
      transform-origin: 256px 270px;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="270" r="175" fill="none" stroke="#00f5d4" stroke-width="2" opacity="0.3" stroke-dasharray="6,12" class="particle-ring" />

  <!-- Battery Terminal Top Cap -->
  <rect x="216" y="74" width="80" height="24" rx="8" fill="url(#neonBorder)" filter="url(#glow)" />
  <rect x="224" y="80" width="64" height="12" rx="4" fill="#ffffff" opacity="0.8" />

  <!-- Main Battery Container Outer Body -->
  <rect x="126" y="112" width="260" height="320" rx="36" fill="#040d21" stroke="url(#neonBorder)" stroke-width="12" filter="url(#glow)" />

  <!-- Inner Chamber Window -->
  <rect x="146" y="132" width="220" height="280" rx="24" fill="#020b18" />

  <!-- Animated Fluid / Energy Level (75% Charged State) -->
  <g class="energy-core">
    <rect x="156" y="210" width="200" height="192" rx="16" fill="url(#energyLiquid)" opacity="0.85" filter="url(#coreGlow)" />
    <!-- Wave crest highlights -->
    <path d="M 156 210 Q 206 195 256 210 T 356 210 L 356 402 L 156 402 Z" fill="url(#energyLiquid)" />
  </g>

  <!-- High-Power Energy Lightning Bolt -->
  <path class="lightning-bolt" d="M 276 150 L 210 266 L 260 266 L 236 362 L 316 244 L 266 244 Z" fill="#ffffff" stroke="#ffbe0b" stroke-width="4" stroke-linejoin="round" />

  <!-- Holographic Grid Lines inside Battery -->
  <line x1="166" y1="200" x2="346" y2="200" stroke="#00f5d4" stroke-width="2" opacity="0.25" stroke-dasharray="4,6" />
  <line x1="166" y1="260" x2="346" y2="260" stroke="#00f5d4" stroke-width="2" opacity="0.25" stroke-dasharray="4,6" />
  <line x1="166" y1="320" x2="346" y2="320" stroke="#00f5d4" stroke-width="2" opacity="0.25" stroke-dasharray="4,6" />

  <!-- Sparkle Energy Accents -->
  <circle cx="180" cy="240" r="4" fill="#ffffff" opacity="0.8" />
  <circle cx="330" cy="300" r="3" fill="#00f5d4" opacity="0.9" />
  <circle cx="190" cy="350" r="5" fill="#70e000" opacity="0.7" />
  <circle cx="320" cy="180" r="4" fill="#ffbe0b" opacity="0.85" />
</svg>
